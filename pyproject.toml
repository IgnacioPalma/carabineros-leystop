[project]
name = "leystop"
version = "0.1.0"
description = "Scraper for Carabineros de Chile's Ley STOP weekly crime statistics, published as Parquet on Cloudflare R2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "polars>=1.10",
]

[project.scripts]
leystop = "leystop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leystop"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
